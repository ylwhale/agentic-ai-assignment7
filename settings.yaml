
# RepoMind Settings - Assignment 7

# Model configuration
provider: openai-compatible
model: gemini-3.5-flash-lite
base_url: https://generativelanguage.googleapis.com/v1beta/openai/
api_key_env: GEMINI_API_KEY

# Maximum tokens for one model response
max_tokens: 8000

# Anthropic-specific settings (not used for Gemini)
effort: null
fallbacks: null

# Token limits for Assignment 7
session_token_ceiling: 1500000
lab_token_ceiling: 20000000

# Number of concurrent runs
jobs: 4
